name: Construir APK PAX JULIA V8

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir grau Mestre Instalado e Galeria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text()
          if 'Mestre Instalado' not in s:
              s = s.replace('<option>Mestre</option>', '<option>Mestre</option><option>Mestre Instalado</option>', 1)
          old_gallery = '<section id="gallery"><h2>Galeria</h2><div class="card"><input id="photoInput" type="file" accept="image/*" multiple><p class="muted">As fotografias escolhidas ficam guardadas neste dispositivo nesta versão.</p></div><div id="galleryGrid" class="grid"></div></section>'
          new_gallery = '<section id="gallery"><h2>Galeria</h2><div class="card"><h3 class="gold">Adicionar fotografia ou vídeo</h3><label>Ficheiros</label><input id="photoInput" type="file" accept="image/*,video/*" multiple><label>Breve descrição</label><textarea id="mediaDescription" rows="3" placeholder="Ex.: Ágape fraternal após a sessão de Loja, com os Irmãos reunidos no Templo."></textarea><label>Data</label><input id="mediaDate" type="date"><p class="muted">A descrição e a data ficam associadas a cada fotografia ou vídeo adicionado.</p><button class="primary" id="addMediaButton">Adicionar à Galeria</button><p id="mediaMsg" class="ok"></p></div><div id="galleryGrid" class="grid"></div></section>'
          if old_gallery in s:
              s = s.replace(old_gallery, new_gallery, 1)
          old_render = "$('galleryGrid').innerHTML=db.photos.map((p,i)=>'<div class=\"card\"><img class=\"photo\" src=\"'+p+'\"><button data-photo=\"'+i+'\" style=\"margin-top:7px\">Apagar</button></div>').join('')||'<div class=\"card\"><p class=\"muted\">Sem fotografias. Adicione imagens acima.</p></div>'"
          new_render = "$('galleryGrid').innerHTML=db.photos.map((p,i)=>{const m=typeof p==='string'?{src:p,type:'image',description:'Fotografia',date:''}:p;const media=m.type==='video'?'<video class=\"photo\" controls preload=\"metadata\" src=\"'+m.src+'\"></video>':'<img class=\"photo\" src=\"'+m.src+'\" alt=\"'+esc(m.description||'Fotografia')+'\">';return '<div class=\"card\">'+media+'<div class=\"item\"><b>'+esc(m.type==='video'?'🎥 Vídeo':'📷 Fotografia')+'</b><br><span class=\"muted\">📅 '+esc(m.date||'Data não indicada')+'</span><p>'+esc(m.description||'Sem descrição.')+'</p></div><button data-photo=\"'+i+'\" style=\"margin-top:7px\">Apagar</button></div>'}).join('')||'<div class=\"card\"><p class=\"muted\">Sem fotografias ou vídeos. Adicione ficheiros acima.</p></div>'"
          if old_render in s:
              s = s.replace(old_render, new_render, 1)
          old_add = "function addPhotos(e){Array.from(e.target.files||[]).forEach(f=>{const r=new FileReader();r.onload=()=>{db.photos.push(r.result);persist();render()};r.readAsDataURL(f)});e.target.value=''}"
          new_add = "function addPhotos(){const files=Array.from($('photoInput').files||[]);if(!files.length){$('mediaMsg').textContent='Selecione pelo menos uma fotografia ou vídeo.';return}const description=$('mediaDescription').value.trim();const date=$('mediaDate').value;if(!description||!date){$('mediaMsg').textContent='Indique a descrição e a data antes de adicionar.';return}let pending=files.length;files.forEach(f=>{const r=new FileReader();r.onload=()=>{db.photos.push({src:r.result,type:f.type.startsWith('video/')?'video':'image',description,date,name:f.name});pending--;if(pending===0){persist();$('photoInput').value='';$('mediaDescription').value='';$('mediaDate').value='';$('mediaMsg').textContent='Ficheiro(s) adicionado(s) à Galeria.';render()}};r.readAsDataURL(f)})}"
          if old_add in s:
              s = s.replace(old_add, new_add, 1)
          if "$('photoInput').addEventListener('change',addPhotos);" in s:
              s = s.replace("$('photoInput').addEventListener('change',addPhotos);", "$('addMediaButton').addEventListener('click',addPhotos);")
          p.write_text(s)
          PY

      - name: Reforçar Área dos Vigilantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          old='<section id="vigilantes"><h2>Área dos Vigilantes</h2><div class="grid"><div class="card"><h3 class="gold">1.º Vigilante</h3><span class="tag">Companheiros</span><p>Acompanhamento dos Companheiros.</p><input id="compTask" placeholder="Novo trabalho / observação"><button class="primary" id="compButton">Guardar</button><div id="compNotes"></div></div><div class="card"><h3 class="gold">2.º Vigilante</h3><span class="tag">Aprendizes</span><p>Acompanhamento dos Aprendizes.</p><input id="aprTask" placeholder="Novo trabalho / observação"><button class="primary" id="aprButton">Guardar</button><div id="aprNotes"></div></div></div></section>'
          new='''<section id="vigilantes"><h2>Área dos Vigilantes</h2><div class="card"><div class="actions"><button class="primary" data-vig-page="first">1.º Vigilante · Companheiros</button><button class="secondary" data-vig-page="second">2.º Vigilante · Aprendizes</button></div></div><div id="vigFirst" class="vig-page"><div class="grid"><div class="card"><h3 class="gold">1.º Vigilante</h3><span class="tag">Responsável pelos Companheiros</span><p class="muted">Obreiros sob acompanhamento:</p><div id="firstMembers"></div><label>Adicionar Companheiro</label><select id="firstMemberSelect"></select><button class="primary" id="firstAssign">Atribuir responsabilidade</button></div><div class="card"><h3>Chat directo</h3><p class="muted">Comunicação entre o 1.º Vigilante e os seus Companheiros.</p><select id="firstChatTo"></select><div id="firstChatMessages"></div><textarea id="firstChatText" placeholder="Mensagem directa..."></textarea><button class="primary" id="firstChatSend">Enviar mensagem</button></div></div><div class="card"><h3 class="gold">Trabalhos dos Companheiros</h3><div class="grid"><div><label>Obreiro</label><select id="firstWorkBrother"></select><label>Data</label><input id="firstWorkDate" type="date"><label>Tema</label><input id="firstWorkTheme" placeholder="Tema do trabalho"><label>Estado</label><select id="firstWorkStatus"><option>Apresentado</option><option>A apresentar</option></select><label>Ligação à Biblioteca da Loja</label><input id="firstWorkLibrary" placeholder="Livro / referência / documento da Biblioteca"><label>Descrição</label><textarea id="firstWorkDesc" rows="3" placeholder="Breve resumo do trabalho"></textarea><button class="primary" id="firstWorkSave">Registar trabalho</button></div><div id="firstWorks"></div></div></div></div><div id="vigSecond" class="vig-page hidden"><div class="grid"><div class="card"><h3 class="gold">2.º Vigilante</h3><span class="tag">Responsável pelos Aprendizes</span><p class="muted">Obreiros sob acompanhamento:</p><div id="secondMembers"></div><label>Adicionar Aprendiz</label><select id="secondMemberSelect"></select><button class="primary" id="secondAssign">Atribuir responsabilidade</button></div><div class="card"><h3>Chat directo</h3><p class="muted">Comunicação entre o 2.º Vigilante e os seus Aprendizes.</p><select id="secondChatTo"></select><div id="secondChatMessages"></div><textarea id="secondChatText" placeholder="Mensagem directa..."></textarea><button class="primary" id="secondChatSend">Enviar mensagem</button></div></div><div class="card"><h3 class="gold">Trabalhos dos Aprendizes</h3><div class="grid"><div><label>Obreiro</label><select id="secondWorkBrother"></select><label>Data</label><input id="secondWorkDate" type="date"><label>Tema</label><input id="secondWorkTheme" placeholder="Tema do trabalho"><label>Estado</label><select id="secondWorkStatus"><option>Apresentado</option><option>A apresentar</option></select><label>Ligação à Biblioteca da Loja</label><input id="secondWorkLibrary" placeholder="Livro / referência / documento da Biblioteca"><label>Descrição</label><textarea id="secondWorkDesc" rows="3" placeholder="Breve resumo do trabalho"></textarea><button class="primary" id="secondWorkSave">Registar trabalho</button></div><div id="secondWorks"></div></div></div></div></section>'''
          if old in s:s=s.replace(old,new,1)
          marker='const KEY=\'paxjulia_v7\';'
          if 'function renderVigilantes()' not in s:
              logic='''function vigMembers(k){if(!Array.isArray(db.vigilantes[k].members))db.vigilantes[k].members=[];return db.vigilantes[k].members} function renderVigilantes(){["first","second"].forEach(k=>{const v=db.vigilantes[k],ids=vigMembers(k),members=ids.map(i=>db.brothers[i]).filter(Boolean);const prefix=k==="first"?"first":"second";$(prefix+"Members").innerHTML=members.map((b,i)=>'<div class="item"><b>'+esc(b.name)+'</b><br><span class="muted">'+esc(b.degree||'')+' · '+esc(b.role||'')+'</span></div>').join('')||'<p class="muted">Nenhum obreiro atribuído.</p>';const eligible=db.brothers.map((b,i)=>({b,i})).filter(x=>x.b.degree===(k==="first"?'Companheiro':'Aprendiz'));const opts=eligible.map(x=>'<option value="'+x.i+'">'+esc(x.b.name)+'</option>').join('');$(prefix+"MemberSelect").innerHTML='<option value="">Selecionar...</option>'+opts;$(prefix+"WorkBrother").innerHTML='<option value="">Selecionar...</option>'+members.map((b,i)=>'<option value="'+ids[i]+'">'+esc(b.name)+'</option>').join('');$(prefix+"ChatTo").innerHTML='<option value="">Selecionar...</option>'+members.map((b,i)=>'<option value="'+ids[i]+'">'+esc(b.name)+'</option>').join('');$(prefix+"Works").innerHTML=(v.works||[]).slice().reverse().map(w=>'<div class="item"><b>'+esc(w.theme)+'</b><br><span class="muted">📅 '+esc(w.date)+' · '+esc(w.status)+' · '+esc((db.brothers[w.brotherId]||{}).name||'Obreiro')+'</span><p>'+esc(w.description||'')+'</p><span class="tag">📚 '+esc(w.library||'Sem referência de Biblioteca')+'</span></div>').join('')||'<p class="muted">Sem trabalhos registados.</p>';$(prefix+"ChatMessages").innerHTML=(v.chat||[]).slice().reverse().map(m=>'<div class="item"><b>'+esc(m.from)+'</b> → '+esc(m.to)+'<br>'+esc(m.text)+'<br><span class="muted">'+esc(m.date)+'</span></div>').join('')||'<p class="muted">Sem mensagens.</p>'})} function vigAssign(k){const prefix=k==='first'?'first':'second',id=$(prefix+'MemberSelect').value;if(id==='')return;const n=Number(id);if(!db.vigilantes[k].members.includes(n))db.vigilantes[k].members.push(n);persist();renderVigilantes()} function vigChat(k){const prefix=k==='first'?'first':'second',to=$(prefix+'ChatTo').value,text=$(prefix+'ChatText').value.trim();if(to===''||!text)return;const b=db.brothers[Number(to)];db.vigilantes[k].chat.push({from:sessionStorage.getItem('pax_login')||'Vigilante',to:b?b.name:'Obreiro',text,date:new Date().toLocaleString('pt-PT')});$(prefix+'ChatText').value='';persist();renderVigilantes()} function vigWork(k){const prefix=k==='first'?'first':'second',bid=$(prefix+'WorkBrother').value,date=$(prefix+'WorkDate').value,theme=$(prefix+'WorkTheme').value.trim(),status=$(prefix+'WorkStatus').value,library=$(prefix+'WorkLibrary').value.trim(),description=$(prefix+'WorkDesc').value.trim();if(bid===''||!date||!theme)return;db.vigilantes[k].works.push({brotherId:Number(bid),date,theme,status,library,description});$(prefix+'WorkTheme').value='';$(prefix+'WorkLibrary').value='';$(prefix+'WorkDesc').value='';persist();renderVigilantes()}'''
              s=s.replace(marker,marker+logic)
          init='''if(!db.vigilantes)db.vigilantes={first:{members:[],chat:[],works:[]},second:{members:[],chat:[],works:[]}};if(!Array.isArray(db.vigilantes.first.members))db.vigilantes.first.members=[];if(!Array.isArray(db.vigilantes.second.members))db.vigilantes.second.members=[];if(!Array.isArray(db.vigilantes.first.chat))db.vigilantes.first.chat=[];if(!Array.isArray(db.vigilantes.second.chat))db.vigilantes.second.chat=[];if(!Array.isArray(db.vigilantes.first.works))db.vigilantes.first.works=[];if(!Array.isArray(db.vigilantes.second.works))db.vigilantes.second.works=[];'''
          s=s.replace('if(!Array.isArray(db.brothers))db.brothers=[];', 'if(!Array.isArray(db.brothers))db.brothers=[];'+init,1)
          listener="$('photoInput').addEventListener('change',addPhotos);"
          extra='''document.querySelectorAll('[data-vig-page]').forEach(b=>b.addEventListener('click',()=>{const first=b.dataset.vigPage==='first';$('vigFirst').classList.toggle('hidden',!first);$('vigSecond').classList.toggle('hidden',first)}));$('firstAssign').addEventListener('click',()=>vigAssign('first'));$('secondAssign').addEventListener('click',()=>vigAssign('second'));$('firstChatSend').addEventListener('click',()=>vigChat('first'));$('secondChatSend').addEventListener('click',()=>vigChat('second'));$('firstWorkSave').addEventListener('click',()=>vigWork('first'));$('secondWorkSave').addEventListener('click',()=>vigWork('second'));'''
          # append listeners before login initialization
          s=s.replace("if(sessionStorage.getItem('pax_login'))showApp();",extra+"if(sessionStorage.getItem('pax_login'))showApp();",1)
          # ensure render() also renders vigilantes
          s=s.replace('function render(){ ', 'function render(){ ',1)
          s=s.replace("$('countB').textContent=db.brothers.length;", "$('countB').textContent=db.brothers.length;renderVigilantes();",1)
          p.write_text(s)
          PY

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android Capacitor
        run: npx cap add android

      - name: Sincronizar aplicação
        run: npx cap sync android

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Criar chave de assinatura e configurar release
        working-directory: android
        run: |
          STORE_PASSWORD=$(openssl rand -hex 24)
          KEY_PASSWORD="$STORE_PASSWORD"
          keytool -genkeypair -v -keystore paxjulia-release.jks -alias paxjulia -keyalg RSA -keysize 2048 -validity 3650 -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=PAX JULIA, OU=Loja 105, O=PAX JULIA, L=Beja, ST=Beja, C=PT"
          export STORE_PASSWORD KEY_PASSWORD
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          store = os.environ['STORE_PASSWORD']
          key = os.environ['KEY_PASSWORD']
          signing = f'''android {{\n    signingConfigs {{\n        release {{\n            storeFile file("../paxjulia-release.jks")\n            storePassword "{store}"\n            keyAlias "paxjulia"\n            keyPassword "{key}"\n        }}\n    }}'''
          s = s.replace('android {', signing, 1)
          s = s.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s)
          PY

      - name: Compilar APK Release assinado
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Verificar assinatura do APK
        working-directory: android
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PAX-JULIA-V8-APK-ASSINADO
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
